name: Forskningsbevakning
on:
  schedule:
    - cron: '0 6 * * *'        # varje dag 06:00 UTC
  push:
    paths: ['searches.txt']    # kör direkt när du ändrar sökningarna
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Hur många dagar bakåt (tom = 14)'
        required: false
permissions:
  contents: write
concurrency: watch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python watch.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - run: |
          git config user.name "watch-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -m "Uppdatera bevakning"; git push
